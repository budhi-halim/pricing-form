<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pricing Form Generator</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/print.css" media="print"><script src="js/icons.js" defer="defer"></script><script src="js/logic.js" defer="defer"></script><script src="js/ui.js" defer="defer"></script></head><body><main id="app-container"><section id="form-view"><header class="app-header"><h1>Pricing Form Setup</h1><button type="button" id="btn-reset" class="icon-btn" aria-label="Reset Form"></button></header><form id="pricing-form"><div class="form-group"><label>Name of Customer</label><input type="text" id="customer_name" placeholder="Enter customer name" required></div><div class="form-group"><label>Person in Charge</label><input type="text" id="person_in_charge" placeholder="Enter PIC name" required></div><div class="form-group"><label>Line Business</label><input type="text" id="line_business" placeholder="Enter line of business" required></div><div class="form-group"><label>Business Scale</label><div class="radio-group"><label class="toggle-label"><input type="radio" name="business_scale" value="National / International" required><div class="toggle-box"><div class="toggle-circle"></div></div><span>National / International</span></label><label class="toggle-label"><input type="radio" name="business_scale" value="Lokal"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Lokal</span></label></div></div><div class="form-group"><label>Business Relationship</label><div class="radio-group"><label class="toggle-label"><input type="radio" name="business_relationship" value="New Customer" required><div class="toggle-box"><div class="toggle-circle"></div></div><span>New Customer</span></label><label class="toggle-label"><input type="radio" name="business_relationship" value="Old Customer"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Old Customer</span></label></div></div><div class="form-group hidden" id="payment-info-group"><label>Payment Info</label><div class="radio-group horizontal-wrap"><label class="toggle-label"><input type="radio" name="payment_info" value="Good"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Good</span></label><label class="toggle-label"><input type="radio" name="payment_info" value="Fair"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Fair</span></label><label class="toggle-label"><input type="radio" name="payment_info" value="Poor"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Poor</span></label><label class="toggle-label"><input type="radio" name="payment_info" value="Bad"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Bad</span></label></div></div><div class="form-group subform hidden" id="purchased-items-group"><label>Purchased Item</label><div id="purchased-items-container"></div><button type="button" id="btn-add-purchased" class="action-btn outline mt-2 hidden"><span class="btn-icon"></span>Add Item</button></div><div class="form-group subform"><label>Name of Product</label><div id="product-names-container"></div><button type="button" id="btn-add-product" class="action-btn outline mt-2"><span class="btn-icon"></span>Add Product</button></div><div class="form-group"><label>Deal System</label><div class="radio-group"><label class="toggle-label"><input type="radio" name="deal_system" value="S/C" required><div class="toggle-box"><div class="toggle-circle"></div></div><span>S/C</span></label><label class="toggle-label"><input type="radio" name="deal_system" value="NOTA PESAN"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Nota Pesan</span></label><label class="toggle-label"><input type="radio" name="deal_system" value="NIHIL"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Nihil</span></label></div></div><div class="form-group"><label>Ideal Price from</label><div class="radio-group horizontal-wrap"><label class="toggle-label"><input type="radio" name="ideal_price_from" value="Customer" required><div class="toggle-box"><div class="toggle-circle"></div></div><span>Customer</span></label><label class="toggle-label"><input type="radio" name="ideal_price_from" value="Sales"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Sales</span></label><label class="toggle-label"><input type="radio" name="ideal_price_from" value="Marketing"><div class="toggle-box"><div class="toggle-circle"></div></div><span>Marketing</span></label></div><div class="mt-4"><input type="number" id="ideal_price_val" step="any" placeholder="Price ($)" required></div></div><div class="form-group"><label>Competitor Price</label><input type="text" id="competitor_price" placeholder="Enter competitor details or range (Optional)"></div><div class="form-group subform"><label>Quantity Order Estimation</label><div class="grid-inputs"><div><label class="sub-label">First Order</label><input type="number" step="any" id="qty_first" placeholder="Qty (kg)" required></div><div><label class="sub-label">Average</label><input type="number" step="any" id="qty_avg" placeholder="Qty (kg)" required></div><div><label class="sub-label">Maximum</label><input type="number" step="any" id="qty_max" placeholder="Qty (kg)" required></div></div></div><button type="submit" class="action-btn primary mt-4">Generate Document</button></form></section><section id="preview-view" class="hidden"><header class="preview-toolbar"><button type="button" id="btn-back" class="icon-btn outline" aria-label="Back"></button><div class="actions-right"><button type="button" id="btn-home" class="icon-btn outline" aria-label="Home"></button><button type="button" id="btn-print" class="action-btn primary">Print / PDF</button></div></header><div class="a4-wrapper"><div id="a4-document"></div></div></section></main></body></html>
